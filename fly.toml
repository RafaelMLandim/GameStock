# Hospedagem na Fly.io: uma máquina em São Paulo, sempre ligada, com disco permanente para o banco.
app = "fronteira-do-estoque"
primary_region = "gru"

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
